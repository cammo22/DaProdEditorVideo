[package]
name = "daprod-video"
version = "1.8.2"
description = "DaProd Video: il montaggio vecchio stile, moderno dentro"
authors = ["DaProd"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "daprod_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# decodifica audio di riserva per WebKit senza AudioDecoder (Mac con Safari vecchio)
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "mp3", "flac", "vorbis"] }

# una sola finestra aperta alla volta (solo sul computer): un secondo avvio passa il file a quella già aperta
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# solo Windows: l'apertura dei .dap/.daprod/.dpv col programma si scrive nel registro dell'utente (come un'installazione "per utente")
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

# Mac, Linux e Android: lo spazio libero sul disco (statvfs) per il controllo prima dell'uscita nel Finale
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
