# GitHub Pages: la home e il banco di montaggio in versione prova, a ogni push su main.
# Il sito compilato (dist/) finisce sul ramo gh-pages. Se Pages non si accende da solo:
# Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # la libreria AI dentro l'app (dist/ai/) non va su Pages: la protezione dei segreti di GitHub scambia il nome di una
      # classe della libreria ("Mistral3ForConditionalGeneration", 32 lettere vicino a "mistral") per una chiave API e
      # blocca il push. Nel browser la libreria arriva dalla CDN come prima (libreria() in src/media/libreriaAI.ts).
      # In dist/ai ci sono anche DeepFilterNet (df_bg.wasm, 34 MB) e l'API di ONNX Runtime per l'audio AI (togliere i rumori,
      # separare voce e base): sul sito prova arrivano dalla CDN jsdelivr (CDN_DEEPFILTERNET e CDN_ORT in libreriaAI.ts).
      - run: rm -rf dist/ai
      - name: Pubblica sul ramo gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "pubblicato su gh-pages: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
