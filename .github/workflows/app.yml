# Compila le app di DaProd Video: EXE portatile e installabile (Windows), DMG (Mac universale).
# L'APK (Android) per ora è in pausa: il lavoro Android è sospeso, il job resta qui spento (if: false) per riprenderlo.
#
#  - su ogni PR: controllo dei tipi, prove automatiche (test/prove.mjs) e compilazione di tutte le app,
#    lasciate fra gli artefatti (controllo che funzioni)
#  - su ogni push su main: se la versione di package.json non ha ancora una release, compila e pubblica da
#    sola la release vX.Y.Z con i file e le note prese dal CHANGELOG. Basta alzare la versione e unire.
#  - a mano (workflow_dispatch) o con un tag v*: stessa cosa.
#
# Firma Android: con i segreti ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e
# ANDROID_KEY_PASSWORD si firma con la chiave DaProd; senza, con una chiave tenuta nella cache della CI
# (resta la stessa fra una release e l'altra, così gli aggiornamenti si installano sopra).
# EXE e DMG non sono firmati da Microsoft/Apple (vedi README).
name: App (Windows, Mac)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versione:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      numero: ${{ steps.v.outputs.numero }}
      pubblica: ${{ steps.v.outputs.pubblica }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          TIPO_REF: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
        run: |
          NUMERO=$(node -p "require('./package.json').version")
          TAG="v$NUMERO"
          PUBBLICA=false
          if [ "$EVENTO" != "pull_request" ]; then
            if [ "$TIPO_REF" = "tag" ] || ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then PUBBLICA=true; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "numero=$NUMERO" >> "$GITHUB_OUTPUT"
          echo "pubblica=$PUBBLICA" >> "$GITHUB_OUTPUT"
          echo "versione $TAG, pubblica release: $PUBBLICA"

  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # baseline numerica dal commit Git immutabile
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: FFmpeg per le fixture e le verifiche media
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Controllo dei tipi
        run: npx tsc --noEmit -p .
      - name: Prove del motore e dei flussi UI (Node)
        run: npm run prova:motore
      - name: Build web
        run: npm run build
      - name: Chromium per le prove
        run: npx playwright install --with-deps chromium
      - name: Prove automatiche (il banco usato da solo in Chromium)
        run: node test/prove.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foto-prove
          path: test/.out/
          if-no-files-found: ignore

  desktop:
    needs: versione
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
            rust: ''
          - os: macos-latest
            nome: mac
            rust: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.nome }}
      - run: npm ci
      - name: Compila (Windows)
        if: matrix.nome == 'windows'
        run: npx tauri build --bundles nsis
      - name: Compila (Mac universale, Intel + Apple Silicon)
        if: matrix.nome == 'mac'
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Raccogli i file
        shell: bash
        run: |
          V="${{ needs.versione.outputs.numero }}"
          mkdir -p uscita
          if [ "${{ matrix.nome }}" = windows ]; then
            cp "src-tauri/target/release/DaProd Video.exe" "uscita/DaProd-Video-$V-portatile.exe"
            cp src-tauri/target/release/bundle/nsis/*-setup.exe "uscita/DaProd-Video-$V-setup.exe"
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "uscita/DaProd-Video-$V.dmg"
          fi
          ls -la uscita
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: uscita/*

  android:
    # in pausa: per riaccenderlo togli questa riga e rimetti android nei needs e nel pattern della release
    if: ${{ false }}
    needs: versione
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android
      - run: npm ci
      - name: NDK e SDK del runner
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
      - name: Chiave dalla cache (senza segreti)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: daprod-video-chiave-android-v1
      - name: Chiave di firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/daprod.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/daprod.keystore" >> "$GITHUB_ENV"
            echo "firma con la chiave DaProd"
          elif [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=DaProd Video,O=DaProd,C=IT"
            echo "chiave nuova creata (resterà nella cache)"
          else
            echo "chiave presa dalla cache"
          fi
      - name: Compila l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk --target aarch64 armv7
      - name: Raccogli l'APK
        run: |
          mkdir -p uscita
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "APK: $APK"
          cp "$APK" "uscita/DaProd-Video-${{ needs.versione.outputs.numero }}.apk"
          ls -la uscita
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: uscita/*

  release:
    # le prove girano lo stesso (si guardano nel loro job) ma non fermano la release
    needs: [versione, desktop]
    if: needs.versione.outputs.pubblica == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: file
          pattern: '{windows,mac}'
          merge-multiple: true
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versione.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          ls -la file
          V="${TAG#v}"
          # note: la sezione del CHANGELOG di questa versione
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && /^---$/ {exit} on {print}' CHANGELOG.md > note.md
          TITOLO=$(grep -m1 "^## \[$V\]" CHANGELOG.md | sed -E 's/^## \[[^]]*\] — [0-9-]+ · //')
          cat >> note.md <<'FINE'

          ### 📥 Scarica e monta
          | | File | Come si usa |
          | --- | --- | --- |
          | 🪟 Windows | `-portatile.exe` | niente installazione: doppio clic e parte (se SmartScreen avvisa: *Ulteriori informazioni → Esegui comunque*) |
          | 💿 Windows | `-setup.exe` | installa DaProd Video con il collegamento nel menu Start |
          | 🍎 Mac | `.dmg` | trascina l'app in Applicazioni; la prima volta *tasto destro → Apri* (non è firmata da Apple) |

          ▶ Oppure prova nel browser: https://cammo22.github.io/DaProdVideo/app/
          FINE
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" file/* --clobber
          else
            gh release create "$TAG" file/* --target "$SHA" --title "$TAG · ${TITOLO:-DaProd Video}" --notes-file note.md
          fi
